<!Doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"> 
    <title>Rooms</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
    rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" 
    crossorigin="anonymous">

  </head>
  <body>
	  
	  <h1>Welcome to Teacher plateform <span th:text="${session.username}"></h1>

      <h1>Create new Course</h1>
    <!-- Form for creating a new course -->
    <form th:action="@{/tutor/create-course}" method="post">
        <!-- Input for Course Name -->
        <div>
            <label for="courseName">Course Name:</label>
            <input type="text" id="courseName" name="courseName" placeholder="Enter course name" required>
        </div>

        <!-- Input for Course Description -->
        <div>
            <label for="description">Course Description:</label>
            <textarea id="description" name="description" placeholder="Enter course description" rows="4" required></textarea>
        </div>

        <!-- Input for Course Price -->
        <div>
            <label for="price">Course Price:</label>
            <input type="number" id="price" name="price" step="0.01" placeholder="Enter course price" required>
        </div>

        <!-- Submit button -->
        <div>
            <button type="submit">Create Course</button>
        </div>
    </form>
    
    <a th:href="@{/user/home}" class="btn btn-primary">Home</a>
</body>
</html>

	  

  </body></html>
