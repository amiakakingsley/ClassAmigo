   <script>
    const sessionId = window.location.pathname.split("/video-call/")[1];
    const signalingServerUrl = `ws://localhost:8080/video-call/${sessionId}`;
    const webSocket = new WebSocket(signalingServerUrl);

    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    let peerConnection;
    let localStream;

    function createPeerConnection() {
        peerConnection = new RTCPeerConnection();

        peerConnection.ontrack = (event) => {
            remoteVideo.srcObject = event.streams[0];
        };

        peerConnection.onicecandidate = (event) => {
            if (event.candidate) {
                webSocket.send(JSON.stringify({ type: 'ice-candidate', candidate: event.candidate }));
            }
        };
    }

    async function startCall() {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            localVideo.srcObject = localStream;

            createPeerConnection();

            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });

            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            webSocket.send(JSON.stringify({ type: 'offer', sdp: offer.sdp }));
        } catch (error) {
            console.error('Error accessing media devices.', error);
        }
    }

    webSocket.onopen = () => {
        console.log('WebSocket connected.');
    };

    webSocket.onmessage = async (message) => {
        const data = JSON.parse(message.data);
        switch (data.type) {
            case 'offer':
                createPeerConnection();
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = localStream;
                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                });

                await peerConnection.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp: data.sdp }));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                webSocket.send(JSON.stringify({ type: 'answer', sdp: answer.sdp }));
                break;

            case 'answer':
                await peerConnection.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: data.sdp }));
                break;

            case 'ice-candidate':
                if (data.candidate) {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
                }
                break;
        }
    };
</script>

<script th:src="@{/home.js}" defer></script>
