<!Doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"> 
    <title>Classmigo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
    rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" 
    crossorigin="anonymous">

  </head>
  <body>
	  
<h1>Welcome, <span th:text="${session.username}"></span> </h1>

	  
	  <div class="container " >
         <a th:href="@{/tutor/home}" class="btn btn-primary">Create a Course</a>
      </div>
	  
	   
	    <a th:href="@{/user/AllUser}" class="btn btn-secondary">Get All User</a>
   
    <table>
        <thead>
            <tr>
				<th>User Id</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Email</th>
                <th>Roles</th>
                <th>Make Admin</th>
            </tr>
        </thead>
        <tbody>
            <!-- Loop through the users and display their information -->
            <tr th:each="user : ${users}">
				 <td th:text="${user.id}"></td>
                <td th:text="${user.firstname}"></td>
                <td th:text="${user.lastname}"></td>
                <td th:text="${user.email}"></td>
                <td>
                <span th:each="role : ${user.roles}" th:text="${role.name}"></span>
                </td>
                <td>
					<a th:href="@{/user/assign_tutor_role/{userId}(userId=${user.id})}" 
                   th:if="${not user.roles.contains('TUTOR')}"
                   class="btn btn-primary">Assign Tutor Role</a>
				  </td>
                
            </tr>
        </tbody>
    </table>
	  
	  <!-- Show success/error messages -->
<div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
<div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>


<div class="container " >
         <a th:href="@{/logout}" class="btn btn-danger">Logout</a>
      </div>
  </body></html>
